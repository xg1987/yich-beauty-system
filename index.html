    <title>祝融｜坤锋美业门店系统</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #5b2aa3;
      }

      .startup-loading {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 28px;
        box-sizing: border-box;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(255, 241, 196, 0.24) 0%, rgba(183, 133, 235, 0.18) 30%, transparent 62%),
          linear-gradient(145deg, #7d43c6 0%, #5b2aa3 48%, #321052 100%);
        color: #f7efff;
      }

      .startup-loading__inner {
        width: min(560px, calc(100vw - 42px));
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }

      .startup-loading__brand {
        display: grid;
        justify-items: center;
        gap: 8px;
      }

      .startup-loading__brand strong {
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
        font-size: clamp(24px, 7vw, 44px);
        font-weight: 900;
        line-height: 1.18;
        letter-spacing: 0.08em;
        color: #fff0bc;
        text-shadow: 0 12px 30px rgba(17, 0, 35, 0.34);
      }

      .startup-loading__brand span {
        color: rgba(245, 233, 255, 0.72);
        font-size: clamp(12px, 3.5vw, 16px);
        font-weight: 760;
        letter-spacing: 0.2em;
      }

      .startup-loading small {
        color: rgba(247, 239, 255, 0.62);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .startup-loading__progress {
        width: min(300px, 72vw);
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(28, 0, 58, 0.42);
      }

      .startup-loading__progress i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #fff0b6 0%, #d7ad55 56%, #f2e6ff 100%);
        animation: startup-loading-pulse 1.4s ease-in-out infinite;
      }

      .startup-loading__progress.is-stopped i {
        animation: none;
        opacity: 0.45;
      }

      .startup-loading__retry {
        border: 1px solid rgba(255, 240, 188, 0.58);
        border-radius: 999px;
        padding: 9px 18px;
        background: rgba(45, 11, 81, 0.5);
        color: #fff0bc;
        font: inherit;
        font-size: 14px;
        font-weight: 760;
        cursor: pointer;
      }

      .startup-loading__retry:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      @keyframes startup-loading-pulse {
        0%,
        100% {
          opacity: 0.42;
        }

        50% {
          opacity: 1;
        }
      }
    </style>

  <body>
    <div id="root">
      <div class="startup-loading" role="status" aria-live="polite">
        <div class="startup-loading__inner">
          <div class="startup-loading__brand">
            <strong>祝融｜坤锋美业门店系统</strong>
            <span>门店经营管理平台</span>
          </div>
          <div class="startup-loading__progress" aria-hidden="true"><i></i></div>
          <small>正在打开系统</small>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const recoveryKeys = ["__yich_update", "__yich_t", "__yich_recover", "__yich_fresh"];
        const hardRecoveryKey = "yich-bootstrap-hard-recovery";

        const hardReload = async () => {
          const button = document.querySelector(".startup-loading__retry");
          if (button) {
            button.disabled = true;
            button.textContent = "正在重新进入";
          }
          try {
            if ("caches" in window) {
              const cacheNames = await window.caches.keys();
              await Promise.all(cacheNames.map((cacheName) => window.caches.delete(cacheName)));
            }
          } catch {}
          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }
          } catch {}
          const nextUrl = new URL(window.location.href);
          recoveryKeys.forEach((key) => nextUrl.searchParams.delete(key));
          nextUrl.searchParams.set("__yich_fresh", `${Date.now()}`);
          window.location.replace(nextUrl.toString());
        };

        const showRecovery = () => {
          const loading = document.querySelector(".startup-loading");
          if (!loading || document.querySelector(".startup-loading__retry")) return;
          loading.querySelector(".startup-loading__progress")?.classList.add("is-stopped");
          const status = loading.querySelector("small");
          if (status) status.textContent = "加载遇到问题，请重新进入";
          const button = document.createElement("button");
          button.type = "button";
          button.className = "startup-loading__retry";
          button.textContent = "重新进入系统";
          button.addEventListener("click", () => void hardReload());
          loading.querySelector(".startup-loading__inner")?.appendChild(button);
        };

        const query = new URLSearchParams(window.location.search);
        const recoveryNavigation = query.has("__yich_update") || query.has("__yich_recover");
        const lastHardRecovery = Number(window.sessionStorage.getItem(hardRecoveryKey));
        if (recoveryNavigation && (!Number.isFinite(lastHardRecovery) || Date.now() - lastHardRecovery > 20_000)) {
          window.sessionStorage.setItem(hardRecoveryKey, `${Date.now()}`);
          const status = document.querySelector(".startup-loading small");
          if (status) status.textContent = "正在修复更新缓存";
          window.stop();
          void hardReload();
          return;
        }

        window.addEventListener("error", (event) => {
          const source = event.filename || event.target?.src || "";
          if (event.error || /\/assets\/.*\.js(?:\?|$)/.test(source)) showRecovery();
        }, true);
        window.addEventListener("unhandledrejection", showRecovery);
        window.setTimeout(showRecovery, 12_000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
