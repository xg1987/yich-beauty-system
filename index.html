<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FBFA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="祝融坤锋美业" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>祝融｜坤锋美业门店系统</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f8fbfa;
      }

      .startup-loading {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f8fbfa;
        color: #2f244f;
      }

      .startup-loading__inner {
        width: min(340px, calc(100vw - 36px));
        display: grid;
        justify-items: center;
        gap: 15px;
        text-align: center;
      }

      .startup-loading small {
        color: #81779a;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .startup-loading__mark {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(93, 75, 128, 0.14);
        border-top-color: #2f9d86;
        border-radius: 999px;
        animation: startup-loading-spin 0.9s linear infinite;
      }

      @keyframes startup-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="icon" href="/favicon.ico?v=0.1.308" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=0.1.308" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=0.1.308" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=0.1.308" />
    <link rel="manifest" href="/manifest.webmanifest?v=0.1.308" />
  </head>
  <body>
    <div id="root">
      <div class="startup-loading" role="status" aria-live="polite">
        <div class="startup-loading__inner">
          <span class="startup-loading__mark" aria-hidden="true"></span>
          <small>正在打开</small>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
